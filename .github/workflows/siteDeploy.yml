name: Build and Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Droits minimaux par défaut : seul le job de déploiement peut écrire (branche gh-pages)
permissions:
  contents: read

# Un seul déploiement à la fois sur gh-pages (partagé avec « Update Themes »)
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # branche de destination
          folder: dist # dossier à publier
          clean: false # conserve les fichiers des années précédentes déjà présents sur gh-pages
