name: Update Themes

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Année à générer (vide = année prochaine)"
        required: false
        type: string
  schedule:
    - cron: "5 0 1 12 *" # 1er décembre : la semaine 1 de l'année ISO suivante peut commencer dès le 29 décembre

# Droits minimaux par défaut : seul le job de déploiement peut écrire (branche gh-pages)
permissions:
  contents: read

# Un seul déploiement à la fois sur gh-pages (partagé avec « Build and Deploy »)
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build and Generate
        env:
          YEAR: ${{ inputs.year }} # passé par variable d'environnement (pas d'injection dans le script)
        run: |
          npm run build
          npm run generate -- "$YEAR"

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages # branche de destination
          folder: dist # dossier à publier
          clean: false # conserve les fichiers des années précédentes déjà présents sur gh-pages
